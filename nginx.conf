# AI 修图 —— Nginx 网关：托管前端 + 反向代理到 FastAPI
# 挂载位置：/etc/nginx/conf.d/default.conf
#
# ⚠️ 这里刻意不使用 "upstream { server api:8000; }" 这种写法。
#   nginx 只在【启动时】解析一次上游域名的 IP，之后一直用这个 IP。
#   而 `docker compose up -d --build` 会重建 api 容器，容器在 ai-net 里的 IP
#   会重新分配；nginx 若不重启就还指向旧 IP，所有请求变成 502 Bad Gateway。
#   正确做法：用 Docker 内置 DNS(127.0.0.11) + 变量形式的 proxy_pass，
#   让 nginx 按 valid=10s 周期重新解析服务名，重建容器后最多 10 秒自动恢复。

server {
    listen 80;
    server_name _;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    charset utf-8;

    # Docker 内置 DNS（用户自定义 bridge 网络里固定是 127.0.0.11）
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 变量形式的上游地址：见文件头说明
    set $api_upstream http://api:8000;

    # RAW 文件体积较大
    client_max_body_size 512m;
    client_body_timeout 300s;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ---------- 前端：ui.html 同时挂在 / 和 /ui.html ----------
    location = / {
        root /usr/share/nginx/html;
        try_files /ui.html =404;
    }

    location = /ui.html {
        root /usr/share/nginx/html;
    }

    # ---------- 其余全部反向代理到 FastAPI ----------
    location / {
        # 变量形式，配合 resolver 每次请求按 TTL 重新解析 api 的 IP
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;

        # 透传客户端信息
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Connection "";

        # SSE / 长轮询：必须关闭缓冲，否则事件会被攒着不下发
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;

        # AI 修图任务耗时较长
        proxy_connect_timeout 60s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;
    }
}
